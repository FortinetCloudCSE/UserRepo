# Deploy the Hugo site to GitHub Pages. All job logic lives in CentralRepo's reusable workflow.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Runner Type'
        default: 'ubuntu-latest'
        type: choice
        options: [ubuntu-latest, self-hosted, org-runners]
      image_variant:
        description: 'Container image to run'
        default: 'prod'
        type: choice
        options: [prod, dev]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # TODO before promoting dev -> main: change @dev to the stable ref (e.g. @v1).
    uses: FortinetCloudCSE/CentralRepo/.github/workflows/pages-deploy.yml@dev
    with:
      runner_type: ${{ inputs.runner_type || 'ubuntu-latest' }}
      image_variant: ${{ inputs.image_variant || 'prod' }}
